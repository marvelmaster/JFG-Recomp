# N64Recomp config for Jet Force Gemini (US).
# Inputs are generated by tools/recomp_gen.py (see build/tmp/rc5.sh):
#   jfg.us.syms.toml   sections / functions / relocs from the ROM's overlay tables
#   jfg.us.recomp.z64  ROM copy with the Rare relocations applied statically (recompiler input only)
[input]
entrypoint = 0x80000400
symbols_file_path = "jfg.us.syms.toml"
rom_file_path = "jfg.us.recomp.z64"
output_func_path = "RecompiledFuncs"

[patches]
# Hand-written asm that N64Recomp cannot translate as separate functions.
# gen_anim_data/func_80074A68/func_80074B50 branch into each other. recomp_anim.py
# replaces their temporary stubs with a single statically translated native region.
# game functions whose names collide with the host C runtime
renamed = [
    "_itoa",
]

stubs = [
    "gen_anim_data",   # tried as one merged function: N64Recomp "Failed to analyze" (computed jumps)
    "func_80074A68",
    "func_80074B50",
    # libultra internals without a proper name in our symbols yet (the runtime replaces this layer anyway):
    "D_8009DA10_9E610",  # mfc0 Compare (timer interrupt code)
    "D_8009F250_9FE50",  # branches to 0x80001044 (exception vector stub)
    "D_8009F3D0_9FFD0",  # hand-written, negative stack offsets
]

# Tell the runtime where the game's own linker (src/runLink.c) put an overlay.
# runlinkDownloadCode: right before `jal osInvalICache` s8 = OverlayHeader* (VramBase, RomAddress, TextSize, DataSize).
[[patches.hook]]
func = "runlinkDownloadCode"
before_vram = 0x80052F30
text = "{ extern void jfg_overlay_loaded(uint8_t* rdram, recomp_context* ctx); jfg_overlay_loaded(rdram, ctx); }"

# Overlay memory is released with mmFree(ptr): the runtime side keeps a map of loaded overlays and unloads on a hit.
[[patches.hook]]
func = "mmFree"
before_vram = 0x8004AA80
text = "{ extern void jfg_mm_free(uint8_t* rdram, recomp_context* ctx); jfg_mm_free(rdram, ctx); }"

# Optional native diagnostic for actual menu transitions.
[[patches.hook]]
func = "frontSetMode"
before_vram = 0x800589F0
text = "{ extern void jfg_front_mode(uint8_t* rdram, recomp_context* ctx); jfg_front_mode(rdram, ctx); }"

[[patches.hook]]
func = "__scHandleRSP"
before_vram = 0x800507F8
text = "{ extern void jfg_rsp_done(uint8_t* rdram, recomp_context* ctx); jfg_rsp_done(rdram, ctx); }"

# Native HLE tasks may outlive the hardware's eleven-VI watchdog (e.g. shader
# compilation). Hardware halt writes cannot cancel native jobs; retain ownership
# until their real completion message instead of clearing a still-pending task.
[[patches.hook]]
func = "__scHandleRetrace"
before_vram = 0x80050154
text = "{ extern void jfg_native_scheduler_tick(uint8_t* rdram, recomp_context* ctx); jfg_native_scheduler_tick(rdram, ctx); }"

# PC port mouse aim: controlGetManualAim(obj, state, ...) runs every frame while the player is in aim mode
# (R held). The native side adds the accumulated mouse motion to the aim yaw (state+0x11C) and pitch
# (state+0x1E2); the function's own clamps run afterwards. a1 = player control state.
[[patches.hook]]
func = "controlGetManualAim"
before_vram = 0x8003AABC
text = "{ extern void jfg_mouse_aim(uint8_t* rdram, recomp_context* ctx); jfg_mouse_aim(rdram, ctx); }"

# PC port mouse camera (opt-in General option "Mouse Camera"): func_8002CF78 (vram 0x8002CF6C, name from the decomp)
# is the normal third-person follow camera (charControl.c), called once per frame per player. At its entry the
# native side rotates the camera position (controlcam+0xC/0x14) around the player and adds the same angle to the
# orbit azimuth (state+0x104) and view yaw (controlcam+0x0). Player movement is already camera relative
# (o16 boyControl: stick angle - *controlcam). a0 = player object, a1 = player control state.
[[patches.hook]]
func = "func_8002CF78"
before_vram = 0x8002CF6C
text = "{ extern void jfg_mouse_camera(uint8_t* rdram, recomp_context* ctx); jfg_mouse_camera(rdram, ctx); }"

# Mouse camera, part 2: func_8002B378 (vram 0x8002B418) dispatches the camera modes; 0x8002B814 is the instruction
# right after `jal func_8002CF78` returns (also the join point of all other camera modes). The native side adds the
# mouse-Y height/pitch offset only if the follow-camera hook above ran in this frame.
[[patches.hook]]
func = "func_8002B378"
before_vram = 0x8002B814
text = "{ extern void jfg_mouse_camera_post(uint8_t* rdram, recomp_context* ctx); jfg_mouse_camera_post(rdram, ctx); }"

# Debug (JFG_TRACE_SCALE): right after modGenAnimMatrices' call of gen_anim_data, log non-zero per-joint scales.
[[patches.hook]]
func = "modGenAnimMatrices"
before_vram = 0x8003D908
text = "{ extern void jfg_trace_anim_scale(uint8_t* rdram, recomp_context* ctx); jfg_trace_anim_scale(rdram, ctx); }"

# Experimental 60 Hz: preserve real elapsed VI delta. viFrameSync owns the
# one-retrace pacing; waiting again at task completion adds an unwanted VI.
[[patches.hook]]
func = "joyRead"
before_vram = 0x80043130
text = "{ extern void jfg_gameplay_tick(uint8_t*, recomp_context*); jfg_gameplay_tick(rdram, ctx); }"

# Debug quick start (--jfg-level): mainChangeLevel(level, char, ...) entry, US build 0x8004665C (jal sites in main.c,
# anim.c, charControl.c). Only changes the arguments when --jfg-level is given; otherwise a no-op.
[[patches.hook]]
func = "mainChangeLevel"
before_vram = 0x8004665C
text = "{ extern void jfg_change_level(uint8_t*, recomp_context*); jfg_change_level(rdram, ctx); }"

# Trace only (JFG_TRACE_TRAP=1): entry of TrapDanglingJump, the overlay trampoline at 0x80054530 (src/hasm/ido/trapDanglingJump.s).
[[patches.hook]]
func = "TrapDanglingJump"
before_vram = 0x80054530
text = "{ extern void jfg_trap_trace(uint8_t*, recomp_context*); jfg_trap_trace(rdram, ctx); }"

[[patches.hook]]
func = "__scHandleRetrace"
before_vram = 0x800506E8
text = "{ extern int jfg_60hz_enabled(void); if (jfg_60hz_enabled()) ctx->r1 = 0; }"

[[patches.hook]]
func = "__scTaskComplete"
before_vram = 0x80050A58
text = "{ extern int jfg_60hz_enabled(void); if (jfg_60hz_enabled()) ctx->r1 = 0; }"

[[patches.hook]]
func = "viFrameSync"
before_vram = 0x80055104
text = "{ extern void jfg_frame_sync_limit(uint8_t*, recomp_context*); jfg_frame_sync_limit(rdram, ctx); }"
